# sub2api-custom：测试通过后构建嵌入模式镜像并推送到 GHCR。
# 镜像任务只在全部检查通过后运行，坏提交不会覆盖 custom-latest。
# 上游的 desktop-release 在本 fork 的 GitHub Actions 设置里已禁用。
name: Custom Image

on:
  push:
    branches:
      - sub2api-custom
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: custom-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund
      - name: Tests
        working-directory: backend
        run: node --test

  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      # 上游代码本身有 lint 错误，这里只检查嵌入模式新增的目录
      - name: Lint (embed)
        working-directory: frontend
        run: npx eslint src/components/embed src/lib/embed
      - name: Vitest
        working-directory: frontend
        run: npm run test:run

  image:
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image name and tags
        id: meta
        run: |
          {
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nova-image-studio"
            echo "short_sha=${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/sub2api-embed.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:custom-latest
            ${{ steps.meta.outputs.image }}:custom-${{ steps.meta.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0
          cache-from: type=gha,scope=custom-image
          cache-to: type=gha,scope=custom-image,mode=max
